<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SAMTECH | Gestão de Ordens de Serviço</title><style>

.pr .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#732f36;color:#fff;padding:16px 18px;border-radius:8px;margin-bottom:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pr .brand b{color:#ddd;font-size:26px}.pr .brand em{color:#fff}.pr .ph h1{font-size:15px;margin:0;text-align:right;letter-spacing:.5px;line-height:1.3}.pr .ph small{display:block;font-weight:normal;opacity:.85;font-size:11px;margin-top:3px}

.pr .kv th{width:30%;background:var(--bg)}.pr .ks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.pr .k{border:1px solid var(--bd);border-top:3px solid #732f36;border-radius:6px;padding:8px;text-align:center}.pr .k b{font-size:18px;display:block;color:var(--ac)}.pr .k span{font-size:10px;color:var(--mu)}
.pr .pill{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:bold;font-size:11px;border:1px solid currentColor}
.pr .blk{break-inside:avoid-page;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-top:12px}.pr .blk p{white-space:pre-wrap;margin:3px 0 8px}
.pr .ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pr .ph3 figure{margin:0;break-inside:avoid}.pr .ph3 img{width:100%;height:140px;object-fit:cover;border-radius:5px;border:1px solid var(--bd)}.pr .ph3 figcaption{font-size:10px;color:var(--mu);margin-top:2px}

.pr .ft{margin-top:20px;border-top:2px solid #732f36;padding-top:6px;font-size:10px;color:var(--mu);text-align:center}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.phs img{width:100%;height:110px;object-fit:cover;border-radius:6px}.cv{width:100%;height:130px;border:1px solid var(--bd);border-radius:6px;touch-action:none;background:#fff;display:block;margin-top:5px}details.dt{margin:4px 0 4px 12px}details.dt>summary{cursor:pointer;padding:4px 0;font-weight:bold}.lf{display:flex;gap:8px;align-items:center;padding:4px 0 4px 14px;flex-wrap:wrap}
#print{display:none}
@media(max-width:640px){.fields{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media print{@page{size:A4;margin:13mm}#app,#toast{display:none!important}#print .ft{position:fixed;bottom:0;left:0;right:0;margin:0;background:#fff}#print{display:block!important;padding-bottom:12mm;background:#fff;--bd:#bbb;--tx:#222;--ac:#732f36;--mu:#666;--bg:#eee;color:#222;font-size:11px}}
</style><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="config.js?v=20261121"></script></head><body><div id="app"><header><span class="brand"><svg width="30" height="34" viewBox="0 0 24 28" fill="#fff"><path d="M12 1c1 5 7 8 7 15a7 7 0 0 1-14 0c0-3 1.500-5 3-6 0 3 1 4 2.500 4.500C10 9 10 5 12 1z"/></svg><span><b>SAM<em>TECH</em></b><small>AUTOMAÇÃO · SISTEMAS DE INCÊNDIO</small></span></span><div><strong>Gestão de Ordens de Serviço</strong><small>Contratos de manutenção e atendimentos pontuais</small></div></header><nav id="nav"></nav><main id="v"></main></div><div id="print"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'—',today=()=>new Date().toLocaleDateString('en-CA');
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mext=m=>MES[+m.slice(5,7)-1]+' de '+m.slice(0,4);
let C=[],O=[],dbx,assets,tab='painel',eo=null,ec=null,fc='',rel={c:'',m:today().slice(0,7)},armed='',dr={photos:[]},tch={},pend=0;
const STS=['Concluída','Com pendências','Em andamento'],TIPOS=['Manutenção preventiva','Manutenção corretiva','Preventiva e corretiva','Inspeção / vistoria','Atendimento pontual','Instalação'];
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
const cn=id=>(C.find(c=>c.id===id)||{}).nome||'—';
const I=(n,l,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const S=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select></label>`;
const T=(n,l,v='')=>`<label class="full">${l}<textarea name="${n}">${esc(v)}</textarea></label>`;
const opt=a=>a.map(x=>[x,x]);
const sc=s=>s==='Concluída'?'s0':s==='Com pendências'?'s1':'s2';
const sorted=a=>a.slice().sort((x,y)=>y.data.localeCompare(x.data)||(y.num||'').localeCompare(x.num||''));
/* ===== Backend Google Drive (GitHub Pages) ===== */
const CFG=window.SAMTECH_CFG||{};let tok,exp=0,ROOT,DATA,cache={},LD={clients:[],os:[]},fold={},ls=[];
const API='https://www.googleapis.com/drive/v3/',UP='https://www.googleapis.com/upload/drive/v3/',qs=encodeURIComponent,JH={'Content-Type':'application/json'};
function auth(){return new Promise((ok,no)=>google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:'https://www.googleapis.com/auth/drive',callback:r=>{if(r.access_token){tok=r.access_token;exp=Date.now()+3300e3;ok()}else no(r)},error_callback:no}).requestAccessToken({prompt:tok?'':'select_account'}))}
async function gf(u,o={}){if(Date.now()>exp)await auth();const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tok}});if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(_){}throw new Error('Drive '+r.status+': '+m)}return r}
const gj=async u=>(await gf(API+u)).json(),esq=s=>s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function folder(name,parent){const k=parent+'/'+name;if(fold[k])return fold[k];const r=await gj(`files?q=${qs(`name='${esq(name)}' and '${parent}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`);let id=r.files[0]&&r.files[0].id;if(!id)id=(await(await gf(API+'files',{method:'POST',headers:JH,body:JSON.stringify({name,parents:[parent],mimeType:'application/vnd.google-apps.folder'})})).json()).id;return fold[k]=id}
async function put(name,parent,blob,fid){const f=new FormData();f.append('metadata',new Blob([JSON.stringify(fid?{name}:{name,parents:[parent]})],{type:'application/json'}));f.append('file',blob);return(await gf(`${UP}files${fid?'/'+fid:''}?uploadType=multipart&fields=id,modifiedTime`,{method:fid?'PATCH':'POST',body:f})).json()}
function rebuild(){LD={clients:[],os:[]};for(const n in cache){const[c,id]=n.slice(0,-5).split('__');if(LD[c])LD[c].push({id,v:cache[n].v})}}
function emit(){for(const[c,cb]of ls)cb({docs:LD[c].map(d=>({id:d.id,data:()=>d.v}))})}
async function pull(){const r=await gj(`files?q=${qs(`'${DATA}' in parents and trashed=false`)}&fields=files(id,name,modifiedTime)&pageSize=1000`);const seen={};let ch=!pull.n;for(const f of r.files){seen[f.name]=1;const c=cache[f.name];if(!c||c.mt!==f.modifiedTime){cache[f.name]={fid:f.id,mt:f.modifiedTime,v:await(await gf(API+'files/'+f.id+'?alt=media')).json()};ch=1}}for(const n in cache)if(!seen[n]){delete cache[n];ch=1}if(ch){pull.n=1;rebuild();emit()}}
const mk=(c,id)=>({id,async set(d){const n=c+'__'+id+'.json',e=cache[n],r=await put(n,DATA,new Blob([JSON.stringify(d)],{type:'application/json'}),e&&e.fid);cache[n]={fid:r.id,mt:r.modifiedTime,v:d};rebuild();emit()},async delete(){const n=c+'__'+id+'.json',e=cache[n];if(e){await gf(API+'files/'+e.fid,{method:'PATCH',headers:JH,body:'{"trashed":true}'});delete cache[n];rebuild();emit()}}});
async function init(){const v=$('#v');
 if(!/^[0-9]+-[\w-]+\.apps\.googleusercontent\.com$/.test(CFG.clientId||'')){v.innerHTML='<section class="panel"><h2>Configuração pendente</h2><p>'+(window.SAMTECH_CFG?'O <b>clientId</b> lido foi: <code>'+esc(String(CFG.clientId||'(vazio)'))+'</code>. Provavelmente é uma versão antiga do <code>config.js</code> em cache: recarregue com Ctrl+F5.':'O arquivo <code>config.js</code> <b>não foi carregado</b>. Ele precisa estar na mesma pasta do <code>index.html</code>, com esse nome exato.')+'</p></section>';return}
 v.innerHTML='<section class="panel"><h2>Entrar</h2><p>Use uma conta Google com acesso à pasta <b>SAMTECH OS</b> no Drive.</p><div class="btns"><button onclick="login()">Entrar com Google</button></div></section>'}
async function login(){try{await auth();let rid=(String(CFG.rootFolderId||'').match(/[-\w]{25,}/)||[])[0];if(rid){try{await gj('files/'+rid+'?fields=id&supportsAllDrives=true')}catch(x){throw new Error('Pasta do rootFolderId não encontrada ou sem acesso. Confira o ID e o compartilhamento com sua conta.')}}ROOT=rid||await folder('SAMTECH OS','root');DATA=await folder('_dados',ROOT);
 assets={upload:async b=>({url:await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})})};
 dbx={collection:c=>({doc:id=>mk(c,id||Math.random().toString(36).slice(2,9)+Date.now().toString(36)),onSnapshot:cb=>ls.push([c,cb])}),doc:p=>{const[c,id]=p.split('/');return mk(c,id)}};
 dbx.collection('clients').onSnapshot(s=>{C=s.docs.map(d=>({...d.data(),id:d.id}));soft()});
 dbx.collection('os').onSnapshot(s=>{O=s.docs.map(d=>({...d.data(),id:d.id}));soft()});
 await pull();if(!Object.keys(cache).length){await dbx.doc('clients/c1').set({nome:'BS Tower Multi Office',tipo:'Contrato',visitas:3,resp:'Izaque Miranda',contato:'',end:'R. Gonçalves Lêdo, 777 – Praia de Iracema, Fortaleza/CE',sis:'3 centrais Eaton CF3000'});await dbx.doc('clients/c2').set({nome:'Empresarial RioMar Kennedy',tipo:'Contrato',visitas:2,resp:'Glaucia Constantino',contato:'',end:'Av. Sgt. Hermínio Sampaio, 3100 – Presidente Kennedy, Fortaleza/CE',sis:'3 centrais Eaton CF3000'})}
 setInterval(()=>pull().catch(()=>{if(Date.now()>exp)toast('Sessão Google expirada: recarregue a página.')}),8000);render();toast('Conectado ao Drive.')}catch(e){console.error(e);const m=e&&(e.message||e.type||e.error)||JSON.stringify(e);$('#v').innerHTML='<section class="panel"><h2>Falha no login</h2><p><b>Detalhe técnico:</b> <code>'+esc(m)+'</code></p><p class="mu">Envie este texto para diagnóstico.</p><div class="btns"><button onclick="login()">Tentar novamente</button></div></section>'}}
async function toDrive(k,id){if(!DATA)return toast('Entre com o Google primeiro.');if(!window.html2pdf)return toast('Biblioteca de PDF não carregou.');
 let html,c,m,name;if(k==='o'){const o=O.find(x=>x.id===id);c=C.find(x=>x.id===o.cliente);m=o.data.slice(0,7);html=osHTML(id);name='OS '+o.num}else{c=C.find(x=>x.id===rel.c);if(!c)return toast('Selecione um cliente.');m=rel.m;html=relHTML();name='Relatório mensal '+c.nome+' '+m}
 toast('Gerando PDF…');const w=document.createElement('div');w.style.cssText='position:fixed;left:-9999px;top:0';const el=document.createElement('div');w.appendChild(el);el.style.cssText='width:190mm;background:#fff;color:#222;font-size:11px;--bd:#bbb;--tx:#222;--ac:#732f36;--mu:#666;--bg:#eee;--ok:#2e7d32;--wa:#b26a00;--inf:#1565c0';el.innerHTML=html;document.body.appendChild(w);scrollTo(0,0);
 try{await new Promise(r=>setTimeout(r,600));const blob=await html2pdf().set({margin:[8,8,10,8],image:{type:'jpeg',quality:.9},html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy'],avoid:['.blk','figure','.k','.sg']}}).from(el).outputPdf('blob');
 const path=[c.tipo==='Contrato'?'Contratos':'Pontuais',c.nome.replace(/[\/\\]/g,'-'),m.slice(0,4),MES[+m.slice(5)-1]];let p=ROOT;for(const s of path)p=await folder(s,p);
 const fn=name.replace(/[\/\\]/g,'-')+'.pdf',ex=(await gj(`files?q=${qs(`name='${esq(fn)}' and '${p}' in parents and trashed=false`)}&fields=files(id)`)).files[0];
 await put(fn,p,blob,ex&&ex.id);toast('Salvo no Drive: '+path.join(' › '))}catch(e){toast('Erro ao salvar no Drive.')}finally{w.remove()}}
function soft(){const a=document.activeElement;if(a&&$('#v').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&tab==='os'||tab==='clientes'&&a&&$('#v').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))pend=1;else render()}
function lista(a){return a.length?`<div class="tw"><table><tr><th>OS</th><th>Data</th><th>Cliente</th><th>Tipo</th><th>Situação</th><th></th></tr>${a.map(o=>`<tr><td>${o.num}</td><td>${fmt(o.data)}</td><td>${esc(cn(o.cliente))}</td><td>${esc(o.tipo)}</td><td class="tag ${sc(o.status)}">${esc(o.status)}</td><td style="white-space:nowrap"><button class="sm" onclick="editOS('${o.id}')">Editar</button> <button class="sm sec" onclick="doPrint(osHTML('${o.id}'))">PDF</button> <button class="sm" onclick="toDrive('o','${o.id}')">☁ Drive</button> <button class="sm dg" onclick="del('o','${o.id}')">Excluir</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Nenhuma ordem de serviço registrada.</p>'}
const card=(n,l)=>`<div class="card"><b>${n}</b><span>${l}</span></div>`;
const views={
painel(){const ym=today().slice(0,7),mo=O.filter(o=>(o.data||'').startsWith(ym)),ct=C.filter(c=>c.tipo==='Contrato'),pd=O.filter(o=>o.status!=='Concluída').length;
return `<div class="cards">${card(ct.length,'Contratos ativos')}${card(C.length-ct.length,'Clientes pontuais')}${card(mo.length,'OS no mês')}${card(pd,'OS em aberto ou com pendências')}</div>
<section class="panel"><h2>Visitas contratadas · ${mext(ym)}</h2>${ct.map(c=>{const n=mo.filter(o=>o.cliente===c.id).length;return `<div class="row"><div class="grow"><b>${esc(c.nome)}</b><div class="bar"><i style="width:${Math.min(100,n/(c.visitas||1)*100)}%"></i></div></div><span>${n}/${c.visitas}</span></div>`}).join('')||'<p class="mu">Nenhum contrato cadastrado.</p>'}</section>
<section class="panel"><h2>Últimas ordens de serviço</h2>${lista(sorted(O).slice(0,5))}<div class="btns"><button onclick="newOS()">+ Nova OS</button></div></section>`},
os(){const o=O.find(x=>x.id===eo)||{},cl=C.map(c=>[c.id,c.nome+' ('+c.tipo+')']);
return `<section class="panel"><h2>${eo?'Editar OS '+esc(o.num):'Nova ordem de serviço'}</h2><form id="fos" onsubmit="return saveOS(event)"><div class="fields">
${S('cliente','Cliente',cl,o.cliente)}${S('tipo','Tipo de serviço',opt(TIPOS),o.tipo)}${I('data','Data',o.data||today(),'date','required')}${I('equipe','Equipe executora',o.equipe)}${I('hi','Início',o.hi||'08:00','time')}${I('hf','Término',o.hf||'12:00','time')}
${I('ai','Alarmes ativos (antes)',o.ai??0,'number','min=0')}${I('fi','Falhas (antes)',o.fi??0,'number','min=0')}${I('af','Alarmes ativos (depois)',o.af??0,'number','min=0')}${I('ff','Falhas (depois)',o.ff??0,'number','min=0')}
${T('sit','Situação inicial',o.sit)}${T('atv','Atividades realizadas',o.atv)}${T('pend','Pendências e recomendações',o.pend)}
<div class="full"><label>Evidências fotográficas (até 12)<input type="file" accept="image/*" multiple onchange="addPhotos(this)"></label><div class="phs" id="phs"></div></div>
${I('recebedor','Responsável do cliente (ciência)',o.recebedor)}${S('status','Situação da OS',opt(STS),o.status)}
<div><label>Assinatura do técnico SAMTECH</label>${o.sT?`<img src="${o.sT}" height="30" alt=""> <span class="mu">salva · desenhe para substituir</span>`:''}<canvas class="cv" id="sT"></canvas><button type="button" class="sec sm" onclick="clr('sT')">Limpar</button></div>
<div><label>Assinatura do responsável do cliente</label>${o.sC?`<img src="${o.sC}" height="30" alt=""> <span class="mu">salva · desenhe para substituir</span>`:''}<canvas class="cv" id="sC"></canvas><button type="button" class="sec sm" onclick="clr('sC')">Limpar</button></div></div>
<div class="btns"><button id="sv">Salvar OS</button>${eo?'<button type="button" class="sec" onclick="eo=null;render()">Cancelar</button>':''}</div></form></section>
<section class="panel"><h2>Ordens de serviço</h2><label>Filtrar por cliente<select onchange="fc=this.value;render()"><option value="">Todos</option>${C.map(c=>`<option value="${c.id}"${c.id===fc?' selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><br>${lista(sorted(O.filter(x=>!fc||x.cliente===fc)))}</section>`},
arq(){const g={};O.forEach(o=>{const c=C.find(x=>x.id===o.cliente)||{nome:'—',tipo:'Contrato'},t=c.tipo==='Contrato'?'Contratos':'Pontuais',y=(o.data||'').slice(0,4),m=(o.data||'').slice(0,7);((((g[t]=g[t]||{})[c.nome]=g[t][c.nome]||{})[y]=g[t][c.nome][y]||{})[m]=g[t][c.nome][y][m]||[]).push({o,c})});
const d=(t,b,open)=>`<details class="dt"${open?' open':''}><summary>${t}</summary>${b}</details>`;
const h=Object.keys(g).sort().map(t=>d('📁 '+t,Object.keys(g[t]).sort().map(n=>d('📁 '+esc(n),Object.keys(g[t][n]).sort().reverse().map(y=>d('📁 '+y,Object.keys(g[t][n][y]).sort().reverse().map(m=>{const L=g[t][n][y][m],cid=L[0].c.id;return d('📁 '+MES[+m.slice(5)-1]+` (${L.length})`,`<div class="lf"><button class="sm" onclick="rel={c:'${cid}',m:'${m}'};doPrint(relHTML())">Relatório do mês (PDF)</button> <button class="sm" onclick="rel={c:'${cid}',m:'${m}'};toDrive('r')">☁ Drive</button></div>`+L.sort((a,b)=>a.o.data.localeCompare(b.o.data)).map(({o})=>`<div class="lf">📄 OS ${o.num} · ${fmt(o.data)} <span class="tag ${sc(o.status)}">${esc(o.status)}</span> <button class="sm sec" onclick="doPrint(osHTML('${o.id}'))">PDF</button> <button class="sm" onclick="toDrive('o','${o.id}')">☁ Drive</button></div>`).join(''))}).join(''))).join(''))).join(''),1)).join('');
return `<section class="panel"><h2>Arquivo de relatórios</h2><p class="mu">Visão por Tipo › Cliente › Ano › Mês. Os botões ☁ Drive salvam o PDF na mesma estrutura de pastas do seu Google Drive.</p>${h||'<p class="mu">Nenhuma OS registrada.</p>'}</section>`},
clientes(){const c=C.find(x=>x.id===ec)||{};
return `<section class="panel"><h2>${ec?'Editar cliente':'Novo cliente'}</h2><form onsubmit="return saveCli(event)"><div class="fields">${I('nome','Nome / razão social',c.nome,'text','required')}${S('tipo','Relação',[['Contrato','Contrato de manutenção'],['Pontual','Atendimento pontual']],c.tipo)}${I('visitas','Visitas mensais contratadas',c.visitas??0,'number','min=0')}${I('resp','Responsável',c.resp)}${I('contato','Contato',c.contato)}${I('sis','Sistema instalado',c.sis)}<label class="full">Endereço<input name="end" value="${esc(c.end)}"></label></div>
<div class="btns"><button>Salvar cliente</button>${ec?'<button type="button" class="sec" onclick="ec=null;render()">Cancelar</button>':''}</div></form></section>
<section class="panel"><h2>Clientes (${C.length})</h2><div class="tw"><table><tr><th>Cliente</th><th>Relação</th><th>Visitas/mês</th><th>OS</th><th></th></tr>${C.map(c=>`<tr><td>${esc(c.nome)}</td><td>${c.tipo}</td><td>${c.tipo==='Contrato'?c.visitas:'—'}</td><td>${O.filter(o=>o.cliente===c.id).length}</td><td style="white-space:nowrap"><button class="sm" onclick="ec='${c.id}';render();scrollTo(0,0)">Editar</button> <button class="sm dg" onclick="del('c','${c.id}')">Excluir</button></td></tr>`).join('')}</table></div></section>`},
rel(){if(!rel.c&&C[0])rel.c=C[0].id;
return `<section class="panel"><h2>Relatório mensal</h2><div class="fields"><label>Cliente<select onchange="rel.c=this.value;render()">${C.map(c=>`<option value="${c.id}"${c.id===rel.c?' selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Mês de referência<input type="month" value="${rel.m}" onchange="rel.m=this.value||rel.m;render()"></label></div><div class="btns"><button onclick="toDrive('r')">☁ Salvar PDF no Drive</button><button class="sec" onclick="doPrint(relHTML())">Imprimir</button></div></section><section class="panel pr">${relHTML()}</section>`}};
function go(t){tab=t;render();scrollTo(0,0)}
function render(){pend=0;$('#nav').innerHTML=[['painel','Painel'],['os','Ordens de serviço'],['arq','Arquivo'],['clientes','Clientes'],['rel','Relatório mensal']].map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#v').innerHTML=views[tab]();if(tab==='os'){paint();sig('sT');sig('sC')}}
function newOS(){eo=null;dr={photos:[]};tch={};go('os')}
function editOS(id){eo=id;dr={photos:((O.find(x=>x.id===id)||{}).photos||[]).map(p=>({...p}))};tch={};go('os')}
/* fotos e assinaturas */
function legs(){document.querySelectorAll('[data-leg]').forEach(i=>dr.photos[+i.dataset.leg].leg=i.value)}
function paint(){const e=$('#phs');if(e)e.innerHTML=dr.photos.map((p,i)=>`<div><img src="${p.url}" alt=""><input data-leg="${i}" value="${esc(p.leg)}" placeholder="Legenda da foto ${i+1}"><button type="button" class="sm dg" onclick="legs();dr.photos.splice(${i},1);paint()">Excluir</button></div>`).join('')}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1000/im.width,1000/im.height),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(ok,'image/jpeg',.62)};im.onerror=no;im.src=u})}
async function addPhotos(inp){if(!assets)return toast('Seu perfil não tem permissão para enviar fotos.');legs();toast('Enviando fotos…');try{for(const f of inp.files){if(dr.photos.length>=12){toast('Limite de 12 fotos.');break}const r=await assets.upload(await shrink(f));dr.photos.push({url:r.url,leg:''});paint()}toast('Fotos prontas.')}catch(e){toast('Falha no envio da foto.')}inp.value=''}
function sig(id){const c=$('#'+id);if(!c)return;c.width=600;c.height=150;const x=c.getContext('2d');x.lineWidth=2.4;x.lineCap='round';let on=0;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*150/r.height]};
c.onpointerdown=e=>{on=1;c.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};c.onpointermove=e=>{if(!on)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke();tch[id]=1};c.onpointerup=()=>on=0}
function clr(id){const c=$('#'+id);c.getContext('2d').clearRect(0,0,600,150);tch[id]=0}
async function saveOS(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));if(!d.cliente){toast('Cadastre um cliente primeiro.');return false}
const b=$('#sv');b.disabled=true;try{const o=O.find(x=>x.id===eo)||{};legs();d.photos=dr.photos;
for(const k of['sT','sC'])d[k]=tch[k]?(await assets.upload(await new Promise(r=>$('#'+k).toBlob(r)))).url:(o[k]||'');
if(!eo){d.seq=Math.max(0,...O.map(x=>x.seq||0))+1;const[y,m,dd]=d.data.split('-');d.num=`${String(d.seq).padStart(3,'0')}.${y}.${m}.${dd}`}
const p={...o,...d};delete p.id;await(eo?dbx.doc('os/'+eo):dbx.collection('os').doc()).set(p);eo=null;dr={photos:[]};tch={};toast('OS salva para todos os usuários.');render()}catch(x){toast('Erro ao salvar: '+(x.message||x.code||x));b.disabled=false}return false}
async function saveCli(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.visitas=+d.visitas||0;try{await(ec?dbx.doc('clients/'+ec):dbx.collection('clients').doc()).set(d);ec=null;toast('Cliente salvo.');render()}catch(x){toast('Erro ao salvar.')}return false}
async function del(k,id){if(armed!==k+id){armed=k+id;toast('Clique em Excluir novamente para confirmar.');return}armed='';
try{if(k==='c'&&O.some(o=>o.cliente===id))return toast('Cliente possui OS registradas.');await dbx.doc((k==='o'?'os/':'clients/')+id).delete()}catch(x){toast('Sem permissão para excluir.')}}
/* PDF */
const brand='<span class="brand"><span><b>SAM<em>TECH</em></b><small>AUTOMAÇÃO · SISTEMAS DE INCÊNDIO</small></span></span>';
const head=(t,s)=>`<div class="ph">${brand}<h1>${t}<small>${s||''}</small></h1></div>`;
const kv=a=>`<table class="kv">${a.map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)||'—'}</td></tr>`).join('')}</table>`;
const foot='<div class="ft">SAMTECH AUTOMAÇÃO LTDA. · Fortaleza – CE · (85) 9 9615-0473 · samtechsdai@gmail.com</div>';
const pill=s=>`<span class="pill ${sc(s)}">${esc(s)}</span>`;
const sign=o=>`<div class="sg"><div>${o&&o.sT?`<img src="${o.sT}" alt="">`:'<span class="sp"></span>'}Técnico SAMTECH<br>${esc(o?o.equipe:'')}</div><div>${o&&o.sC?`<img src="${o.sC}" alt="">`:'<span class="sp"></span>'}Responsável do cliente (ciência)<br>${esc(o?o.recebedor:'')}</div></div>`;
const body=o=>`<div class="ks"><div class="k"><b>${o.ai} → ${o.af}</b><span>ALARMES ATIVOS</span></div><div class="k"><b>${o.fi} → ${o.ff}</b><span>FALHAS</span></div><div class="k"><b>${(o.photos||[]).length}</b><span>FOTOS</span></div><div class="k"><b>${pill(o.status)}</b><span>SITUAÇÃO</span></div></div><h4>Situação inicial</h4><p>${esc(o.sit)||'—'}</p><h4>Atividades realizadas</h4><p>${esc(o.atv)||'—'}</p><h4>Pendências e recomendações</h4><p>${esc(o.pend)||'Sem pendências.'}</p>${(o.photos||[]).length?`<h4>Registro fotográfico</h4><div class="ph3">${o.photos.map((p,i)=>`<figure><img src="${p.url}" alt=""><figcaption>Foto ${i+1}${p.leg?': '+esc(p.leg):''}</figcaption></figure>`).join('')}</div>`:''}`;
function osHTML(id){const o=O.find(x=>x.id===id),c=C.find(x=>x.id===o.cliente)||{};
return `<div class="pr">${head('ORDEM DE SERVIÇO<br>Nº '+o.num,fmt(o.data))}${kv([['Cliente',c.nome],['Endereço',c.end],['Sistema',c.sis],['Data / horário',fmt(o.data)+' · '+o.hi+' às '+o.hf],['Tipo de serviço',o.tipo],['Equipe executora',o.equipe]])}${body(o)}${sign(o)}${foot}</div>`}
function relHTML(){const c=C.find(x=>x.id===rel.c);if(!c)return '<p class="mu">Cadastre um cliente.</p>';
const L=O.filter(o=>o.cliente===c.id&&(o.data||'').startsWith(rel.m)).sort((a,b)=>a.data.localeCompare(b.data));
const vis=c.tipo==='Contrato'?`${L.length} de ${c.visitas} visitas contratadas`:`${L.length} atendimento(s) pontual(is)`;
return `<div class="pr">${head('RELATÓRIO MENSAL DE MANUTENÇÃO<br>DO SDAI',mext(rel.m))}${kv([['Cliente',c.nome],['Endereço',c.end],['Sistema',c.sis],['Relação',c.tipo==='Contrato'?'Contrato de manutenção':'Atendimento pontual'],['Período de referência',mext(rel.m)],['Visitas realizadas',vis],['Responsável',c.resp]])}<h3>Resumo do período</h3>${L.length?`<div class="tw"><table><tr><th>OS</th><th>Data</th><th>Tipo</th><th>Alarmes</th><th>Falhas</th><th>Situação</th></tr>${L.map(o=>`<tr><td>${o.num}</td><td>${fmt(o.data)}</td><td>${esc(o.tipo)}</td><td>${o.ai} → ${o.af}</td><td>${o.fi} → ${o.ff}</td><td>${esc(o.status)}</td></tr>`).join('')}</table></div>${L.map(o=>`<div class="blk"><h4 style="margin-top:0">OS ${o.num} · ${fmt(o.data)} · ${o.hi} às ${o.hf} · ${esc(o.equipe)}</h4>${body(o)}</div>`).join('')}`:'<p>Nenhuma OS registrada no período.</p>'}${sign(null)}${foot}</div>`}
function doPrint(h){$('#print').innerHTML=h;setTimeout(()=>{try{window.print()}catch(e){toast('Use Ctrl+P para imprimir ou salvar em PDF.')}},700)}
render();init();
</script></body></html>
